<!doctype html><meta charset="utf-8"><title>3D test</title>
<body style="margin:0;background:#1b2230;color:#fff;font:14px sans-serif">
<div id="row" style="display:flex;gap:8px;padding:8px"></div><pre id="log"></pre>
<script type="module">
const q = new URLSearchParams(location.search);
const base = q.get("base");
const log = (m) => (document.getElementById("log").textContent += m + "\n");
try {
  let hero = null;
  try {
    const r = await fetch("/api/avatar/landmarks", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ canonical_name: q.get("name") }) });
    const j = await r.json();
    if (j.status === "ok") hero = j;
  } catch (e) { log("hero landmarks: " + e); }
  const mod = await import("/static/avatar-3d.js?t=" + Date.now());
  const poses = [
    { name: "neutral", pose: {} },
    { name: "AH (open)", pose: { open: 0.9 } },
    { name: "OH (round)", pose: { open: 0.5, wide: -0.9 } },
    { name: "EE (spread)", pose: { open: 0.22, wide: 0.9 } },
    { name: "MM (pressed)", pose: { press: 1 } },
  ];
  for (const p of poses) {
    const wrap = document.createElement("div");
    wrap.innerHTML = `<div>${p.name}</div>`;
    const c = document.createElement("canvas");
    c.style.cssText = "width:310px;height:310px;background:#223;border-radius:8px";
    wrap.appendChild(c);
    document.getElementById("row").appendChild(wrap);
    const pup = await mod.createSkinHeadPuppet(c, base, hero);
    pup.render(p.pose); if (!window.__dbg) { window.__dbg = 1; log("debug " + JSON.stringify(pup.debug, (k, v) => typeof v === "number" ? +v.toFixed(3) : v)); }
  }
  log("rendered ok");
} catch (e) { log("ERROR: " + (e.stack || e)); }
</script>
