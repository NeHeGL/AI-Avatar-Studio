name: Release

# Run by hand: Actions > Release > Run workflow, and type the version (e.g. v1.0.0).
# It builds the .exe with build_standalone.py (on Windows: a Windows .exe can only be built on Windows) and publishes one zip, holding
# AI-Avatar-Studio.exe and README.md, as a GitHub Release. The source code is the repository itself.
# "dry run" builds the zip and attaches it to the run, without tagging or publishing anything.

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to release (e.g. v1.0.0)'
        required: true
      dry_run:
        description: 'Dry run: build the files, but do not tag or publish'
        type: boolean
        default: false

jobs:
  release:
    runs-on: windows-latest
    permissions:
      contents: write
    env:
      VER: ${{ inputs.version }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4.2.2

      - name: Check the version
        shell: bash
        run: |
          if ! [[ "$VER" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Version must look like v1.0.0 (got '$VER')"; exit 1
          fi
          if git ls-remote --exit-code --tags origin "refs/tags/$VER" >/dev/null 2>&1; then
            echo "::error::Tag $VER already exists. Pick a new version."; exit 1
          fi

      - name: Set up uv
        uses: astral-sh/setup-uv@v6

      - name: Build the .exe
        shell: bash
        run: uv run --no-project --python 3.11 build_standalone.py "$VER"

      - name: Dry run - attach the zip to this run
        if: ${{ inputs.dry_run }}
        uses: actions/upload-artifact@v4
        with:
          name: dry-run-${{ inputs.version }}
          path: dist/AI-Avatar-Studio-*-windows-x64.zip

      - name: Create the tag and the GitHub Release
        if: ${{ !inputs.dry_run }}
        uses: softprops/action-gh-release@v2.3.2
        with:
          tag_name: ${{ inputs.version }}
          target_commitish: ${{ github.sha }}
          name: "AI Avatar Studio ${{ inputs.version }}"
          files: dist/AI-Avatar-Studio-*-windows-x64.zip
          body: |
            ## AI Avatar Studio ${{ inputs.version }}

            ### Installation
            1. Download `AI-Avatar-Studio-${{ inputs.version }}-windows-x64.zip` (not the automatic "Source code" files)
            2. Extract it into the folder, or onto the drive, where you want the app and its downloads to live (about 30 GB)
            3. Run `AI-Avatar-Studio.exe`. The first run unpacks the app beside it, installs Python and the packages, and starts the app; the chat model, video engine and voice (about 22 GB) download with progress on the start screen. After that it starts straight away.

            Windows may warn about an unknown publisher because the program is not signed: choose **More info**, then **Run anyway**.

            ### Requirements
            - Windows 10/11 (64-bit). You do not need to install Python.
            - An NVIDIA graphics card (RTX 20-series or newer; 16 GB of video memory works, 32 GB is best)
            - About 30 GB of free disk space for the one-time install, and an internet connection for it
